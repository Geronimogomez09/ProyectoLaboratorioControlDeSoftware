<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="icon" type="image/x-icon" href="images/logo-kaisenfade.png">
    <link rel="stylesheet" href="CSS/sign_up.css">
</head>
<body>
    <div class="registro-container">

        <h2>Crear Cuenta</h2>

        <form>

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" placeholder="Ingrese su nombre" required>
            </div>

            <div class="form-group">
                <label>Apellido</label>
                <input type="text" placeholder="Ingrese su apellido" required>
            </div>

            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" placeholder="Ingrese su correo" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="Ingrese una contraseña" required>
            </div>

            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" placeholder="Repita la contraseña" required>
            </div>

            <button type="submit">
                Registrarse
            </button>

        </form>

        <div class="login-link">
            
            <a href="log_in.html">¿Ya tienes una cuenta? Inicia sesión</a>
        </div>

    </div>
</body>
</html>
